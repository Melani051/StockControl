<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - StockControl</title>
  <link rel="stylesheet" href="/estilos.css" />
</head>
<body>
  <header>
    <h1>StockControl</h1>
    <nav id="menuRol" aria-label="Navegación principal">
      <a href="/">Inicio</a>
      <a href="/productos.html">Productos</a>
      <a href="/movimientos.html">Movimientos</a>
    </nav>
  </header>

  <main>
    <h2 id="bienvenida"></h2>
    <section class="cards">
      <article class="card">
        <h3>Total de productos</h3>
        <p id="totalProductos">0</p>
      </article>
      <article class="card">
        <h3>Cantidad total en inventario</h3>
        <p id="totalInventario">0</p>
      </article>
      <article class="card">
        <h3>Productos con bajo stock</h3>
        <p id="bajoStock">0</p>
      </article>
      <article class="card">
        <h3>Valor total del inventario</h3>
        <p id="valorTotalInventario">$0.00</p>
      </article>
    </section>
    <section class="panel-card" aria-labelledby="alerts-title">
      <h2 id="alerts-title">Alertas de stock bajo</h2>
      <div id="alertasStock" aria-live="polite"></div>
    </section>
    <section class="panel-card" aria-labelledby="activity-title">
      <h2 id="activity-title">Últimos movimientos</h2>
      <ul id="ultimosMovimientos" aria-live="polite"></ul>
    </section>
  </main>

  <script src="/script.js"></script>
</body>
</html>
