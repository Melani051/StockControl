
name: CI StockControl

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar sintaxis JavaScript
        run: |
          for file in app.js lib/*.js middleware/*.js routes/*.js public/*.js src/*.js; do
            node --check "$file"
          done

      - name: Ejecutar pruebas automáticas
        run: npm test
