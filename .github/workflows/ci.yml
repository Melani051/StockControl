name: CI - StockControl

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          for file in app.js routes/*.js middleware/*.js public/openfood.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Run tests
        run: npm test

      - name: Show result
        if: success()
        run: echo "CI finished successfully - all checks passed"